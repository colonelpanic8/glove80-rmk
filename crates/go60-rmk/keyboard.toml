# MoErgo Go60 experimental RMK configuration.
#
# Matrix, pin, flash, LED, and USB facts are transcribed from the official
# moergo-sc/zmk Go60 board definitions. The first port uses BLE between halves;
# automatic BLE/TRRS switching remains an explicit follow-up. The Cirque
# trackpads are wired in src/trackpad.rs, outside this file.

[keyboard]
name = "Go60"
product_name = "Go60"
vendor_id = 0x16c0
product_id = 0x27db
manufacturer = "MoErgo"
chip = "nrf52840"

[rmk]
split_central_max_latency_powered = 0
split_central_max_latency_battery = 1

[layout]
rows = 5
cols = 14
# The map is the board's *physical* arrangement, not its scan matrix. Key
# centres derived from this walk are the only geometry the lighting engine has,
# so this arrangement — not column adjacency in the matrix — is what "nearby"
# means to the spatial effects (Reactive, Ripple, Rain, Vortex).
#
# Positions are transcribed in key units from moosylog's Glide editor
# (basic_edit/glide_v20.html, `GO60_GEO_RAW`), which places the board 17u wide:
# each half's six finger columns carry their own stagger, and the thumb arcs are
# one cap swept about a pivot 4.25u below its flat spot.
#
# Written in the same order as the matrix transform in go60.dtsi, which is also
# the order the `[[keymap.layer]]` key strings below are read in: four 12-key
# rows, six fifth-row finger keys, then the two three-key thumb arcs.
map = """
(0,0,L,@outer) (0,1,L,@outer) (0,2,L,@ring) (0,3,L) (0,4,L,@index) (0,5,L,@inner) [5] (0,8,R,@inner) (0,9,R,@index) (0,10,R) (0,11,R,@ring) (0,12,R,@outer) (0,13,R,@outer)
(1,0,L,@outer) (1,1,L,@outer) (1,2,L,@ring) (1,3,L) (1,4,L,@index) (1,5,L,@inner) [5] (1,8,R,@inner) (1,9,R,@index) (1,10,R) (1,11,R,@ring) (1,12,R,@outer) (1,13,R,@outer)
(2,0,L,@outer) (2,1,L,@outer) (2,2,L,@ring) (2,3,L) (2,4,L,@index) (2,5,L,@inner) [5] (2,8,R,@inner) (2,9,R,@index) (2,10,R) (2,11,R,@ring) (2,12,R,@outer) (2,13,R,@outer)
(3,0,L,@outer) (3,1,L,@outer) (3,2,L,@ring) (3,3,L) (3,4,L,@index) (3,5,L,@inner) [5] (3,8,R,@inner) (3,9,R,@index) (3,10,R) (3,11,R,@ring) (3,12,R,@outer) (3,13,R,@outer)
[2] (4,2,L,@ring) (4,3,L) (4,4,L,@index) [7] (4,9,R,@index) (4,10,R) (4,11,R,@ring)
[4] [r=15@(4.5,9)] (0,6,L,@thumb_1) [r=30@(4.5,9)] (1,6,L,@thumb_2) [r=45@(4.5,9)] (2,6,L,@thumb_3) [5] [r=-45@(12.5,9)] (2,7,R,@thumb_1) [r=-30@(12.5,9)] (1,7,R,@thumb_2) [r=-15@(12.5,9)] (0,7,R,@thumb_3)
"""

# The map walk is a left-to-right cursor on a flat grid, so anything off that
# grid is carried by a named shape or a rotation region. The finger shapes are
# the per-column stagger: the middle column sits highest and takes no shape.
# The thumbs are a fan, expressed the way the board draws it — every cap starts
# at the same flat spot (x = 4.5, y = 4.75 on the left) and `[r=deg@(x,y)]`
# swings it about the shared pivot. `thumb_1..3` only walk the cursor back onto
# that one flat spot, since each key advances it another unit.
[layout.shapes]
outer = { y = 0.9 }
ring = { y = 0.25 }
inner = { y = 0.25 }
index = { y = 0.15 }
thumb_1 = { x = 0.0, y = -0.75 }
thumb_2 = { x = -1.0, y = -0.75 }
thumb_3 = { x = -2.0, y = -0.75 }

[keymap]
layers = 5

[[keymap.layer]]
name = "Base"
keys = """
Equal Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 Minus
Tab Q W E R T Y U I O P Backslash
Escape A S D F G H J K L Semicolon Quote
MO(3) Z X C V B N M Comma Dot Slash TG(1)
Grave Delete Backspace LGui LeftBracket RightBracket
MO(2) LShift LCtrl LAlt Space MT(Enter, RAlt)
"""

[[keymap.layer]]
name = "Keypad"
keys = """
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _
_ _ _ _ _ _
"""

[[keymap.layer]]
name = "Symbol Nav"
keys = """
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _
_ _ _ _ _ _
"""

[[keymap.layer]]
name = "Magic"
keys = """
User10 No No No No No No No No No No User11
Bootloader OutputModeCycle BacklightDown BacklightUp No RgbTog No No No No No User12
Reboot No No No No No No No No No No No
No No No No No No No No No No No No
No No No No No No
No No No No No TO(0)
"""

[[keymap.layer]]
name = "Factory"
keys = """
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _
_ _ _ _ _ _
"""

[event.keyboard]
channel_size = 16
pubs = 2
subs = 4

[event.layer_change]
channel_size = 4
pubs = 2
# The split driver, the Rynk topic, the lighting state, and the trackpads'
# layer-driven modes. A subscriber past this count fails at boot, not build.
subs = 4

[event.lighting_changed]
channel_size = 2
pubs = 1
subs = 3

[event.led_indicator]
channel_size = 3
pubs = 2
subs = 4

[event.action]
channel_size = 16
pubs = 1
subs = 1

[event.battery_status]
channel_size = 2
pubs = 1
subs = 1

[event.peripheral_battery]
channel_size = 3
pubs = 1
subs = 3

[storage]
enabled = true
start_addr = 0xec000
num_sectors = 8

[ble]
enabled = true

[host]
vial_enabled = false
rynk_enabled = true
insecure = false
# Keep unattended configuration and firmware deployment available. Go60 does
# not yet bind a physical maintenance-mode toggle.
maintenance_lock_default = false

[split]
# TODO(go60): dynamically choose BLE or half-duplex UARTE0 from TRRS detect.
connection = "ble"

[split.central]
rows = 5
cols = 7
row_offset = 0
col_offset = 0
ble_addr = [0x01, 0x30, 0x36, 0x4f, 0x47, 0xc7]
battery_adc_pin = "vddh"

[split.central.matrix]
matrix_type = "normal"
row2col = true
row_pins = ["P1_01", "P1_03", "P1_05", "P1_07", "P1_06"]
col_pins = ["P0_24", "P0_20", "P0_17", "P0_15", "P0_16", "P0_13", "P0_14"]

[[split.peripheral]]
rows = 5
cols = 7
row_offset = 0
col_offset = 7
ble_addr = [0x02, 0x30, 0x36, 0x4f, 0x47, 0xc7]
battery_adc_pin = "vddh"

[split.peripheral.matrix]
matrix_type = "normal"
row2col = true
row_pins = ["P1_01", "P1_03", "P1_05", "P1_07", "P1_06"]
col_pins = ["P0_14", "P0_13", "P0_16", "P0_15", "P0_17", "P0_20", "P0_24"]

