[package]
name = "glove80-control"
version = "0.1.0"
edition = "2021"
description = "Control Glove80 keymaps, lighting, versions, and bootloaders over Rynk"
license = "MIT"

[dependencies]
anyhow = "1.0"
# Same version the protocol types use, for building their heapless payloads.
heapless = { version = "0.9", default-features = false }
clap = { version = "4.5", features = ["derive"] }
# Pure host-side configuration model, shared with the browser configurator.
glove80-config = { path = "../glove80-config" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# USB transport: direct hidraw ioctls (no libudev/hidapi C dependency).
libc = "0.2"
# RMK-native configuration protocol for USB, serial, and BLE operations.
rynk = { path = "../../dependencies/rmk/rynk" }
rynk-serial = { path = "../../dependencies/rmk/rynk/rynk-serial" }
rynk-ble = { path = "../../dependencies/rmk/rynk/rynk-ble" }
embassy-futures = "0.1"
tokio = { version = "1.47", features = ["net", "rt-multi-thread"] }

[dev-dependencies]
# Decodes `[layout]` through the same blob path the firmware serves over
# GetLayout, so tests/board_geometry.rs checks the real derived key centres.
rynk-kle = { path = "../../dependencies/rmk/rynk/rynk-kle" }
