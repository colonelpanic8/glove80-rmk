# MoErgo Glove80 — RMK spike configuration.
#
# Hardware facts are transcribed from the ZMK board definition in
# the legacy glove80-config zmk/app/boards/arm/glove80/ files. The scan matrix
# is the same 6x14 grid used by the ZMK matrix transform: columns 0-6 are the
# left half (column 6 = left thumb cluster), columns 7-13 are the right half
# (column 7 = right thumb cluster). Grid positions (0,5), (0,8), (5,5) and
# (5,8) have no physical switch. Those two thumb "columns" are physically fans
# of six keys under the thumbs, so `[layout].map` below describes the real
# arrangement rather than the matrix.

[keyboard]
name = "Glove80"
product_name = "Glove80"
vendor_id = 0x16c0
product_id = 0x27db
manufacturer = "MoErgo"
chip = "nrf52840"

[rmk]
# Four key-selectable BLE profile slots. The USER id map shifts with this
# number: User0-3 select, User4/5 next/previous, User6 clears the active
# bond, User7 toggles the preferred transport, User8 (held) clears the
# split peer.
ble_profiles_num = 4
# The right half carries both input and replicated lighting state over the
# split link. On USB power attend every 7.5 ms event; on battery allow one
# skipped event (15 ms maximum interval) to retain some radio savings.
split_central_max_latency_powered = 0
split_central_max_latency_battery = 1
# Room for a layout imported from the MoErgo Layout Editor. The morse, combo
# and macro tables are all written over Rynk, so an import needs no rebuild —
# but their capacities are compile-time, and the defaults (8 morses, 8 combos)
# fit only the keymap below. Sized for a large imported layout instead:
# TailorKey v5.2 Bilateral lands at 59 morses, 20 combos and six short macros.
morse_max_num = 128
combo_max_num = 32
macro_space_size = 512

[layout]
rows = 6
cols = 14
# The map is the board's *physical* arrangement, not its scan matrix: rows here
# are the six visible rows, with each half's six thumb keys sitting in the
# bottom two rows where the hand actually finds them. Key centres derived from
# this walk are the only geometry the lighting engine has, so this arrangement
# — not column adjacency in the matrix — is what "nearby" means to the spatial
# effects (Reactive, Ripple, Rain, Vortex). Positions are transcribed in key
# units from the MoErgo ZMK board definition, glove80-layouts.dtsi.
#
# Written in the same order as the ZMK matrix transform in glove80.dtsi, which
# is also the order the `[[keymap.layer]]` key strings below are read in.
map = """
(0,0,L,@drop) (0,1,L,@drop) (0,2,L) (0,3,L) (0,4,L) [8] (0,9,R) (0,10,R) (0,11,R) (0,12,R,@drop) (0,13,R,@drop)
(1,0,L,@drop) (1,1,L,@drop) (1,2,L) (1,3,L) (1,4,L) (1,5,L) [6] (1,8,R) (1,9,R) (1,10,R) (1,11,R) (1,12,R,@drop) (1,13,R,@drop)
(2,0,L,@drop) (2,1,L,@drop) (2,2,L) (2,3,L) (2,4,L) (2,5,L) [6] (2,8,R) (2,9,R) (2,10,R) (2,11,R) (2,12,R,@drop) (2,13,R,@drop)
(3,0,L,@drop) (3,1,L,@drop) (3,2,L) (3,3,L) (3,4,L) (3,5,L) [6] (3,8,R) (3,9,R) (3,10,R) (3,11,R) (3,12,R,@drop) (3,13,R,@drop)
(4,0,L,@drop) (4,1,L,@drop) (4,2,L) (4,3,L) (4,4,L) (4,5,L) (0,6,*,@thumb_0_6) (1,6,*,@thumb_1_6) (2,6,*,@thumb_2_6) (2,7,*,@thumb_2_7) (1,7,*,@thumb_1_7) (0,7,*,@thumb_0_7) (4,8,R) (4,9,R) (4,10,R) (4,11,R) (4,12,R,@drop) (4,13,R,@drop)
(5,0,L,@drop) (5,1,L,@drop) (5,2,L) (5,3,L) (5,4,L) (3,6,*,@thumb_3_6) (4,6,*,@thumb_4_6) (5,6,*,@thumb_5_6) [2] (5,7,*,@thumb_5_7) (4,7,*,@thumb_4_7) (3,7,*,@thumb_3_7) (5,9,R) (5,10,R) (5,11,R) (5,12,R,@drop) (5,13,R,@drop)
"""

# The map walk is a left-to-right cursor, so anything off the uniform grid is
# carried by a named shape. `@drop` lowers each half's outer two columns by the
# board's half-unit stagger. Every thumb key gets its own shape because the
# clusters are fans, not grids: ZMK sweeps each key about a pivot 4.75u below
# the bottom row, which is equivalent to placing the cap at the swept centre
# and rotating it in place. `x`/`y` nudge the key from its cursor slot onto
# that centre and `r` is the cap angle; the two halves mirror about x = 9.
[layout.shapes]
drop = { y = 0.5 }
thumb_0_6 = { x = 0.125, y = 1.0694, r = 30.0 }
thumb_1_6 = { x = 0.0052, y = 1.7448, r = 45.0 }
thumb_2_6 = { x = -0.3194, y = 2.625, r = 60.0 }
thumb_3_6 = { x = 0.1116, y = 0.696, r = 20.0 }
thumb_4_6 = { x = 0.0891, y = 1.2604, r = 40.0 }
thumb_5_6 = { x = -0.1854, y = 2.125, r = 60.0 }
thumb_0_7 = { x = -0.125, y = 1.0694, r = -30.0 }
thumb_1_7 = { x = -0.0052, y = 1.7448, r = -45.0 }
thumb_2_7 = { x = 0.3194, y = 2.625, r = -60.0 }
thumb_3_7 = { x = -0.1116, y = 0.696, r = -20.0 }
thumb_4_7 = { x = -0.0891, y = 1.2604, r = -40.0 }
thumb_5_7 = { x = 0.1854, y = 2.125, r = -60.0 }

[keymap]
layers = 16
# Ported from legacy glove80-config/config/glove80.keymap. Layers: 0 Base,
# 1 Lower, 2 Magic,
# 3 Games, 4 Mac Hyper. Layers 5-15 are unassigned editable capacity, sized so
# an imported editor layout fits without a rebuild.
# Substitutions from the ZMK keymap:
#   - &magic hold-tap        -> MO(2) plus board-local lighting wake/status
#   - lower left thumb arc   -> User0..User2 (select the slot AND prefer
#     BLE output, so a slot key both picks and routes to that connection;
#     slot 3 exists but is only reachable via `glove80-control connection`)
#   - upper thumb (Esc pos)  -> OutputUsb (prefer USB output)
#   - no clearing action is bound to a key; bond management goes through
#     `glove80-control connection clear <slot>`
#   - left &bootloader       -> Bootloader
#   - right &bootloader      -> User12 (forwarded to the peripheral)
#   - &sys_reset             -> Reboot
#   - Games+MacHyper conditional layer is not ported (no RMK equivalent).
[[keymap.layer]]
name = "Base"
keys = """
F1 F2 F3 F4 F5 F6 F7 F8 F9 F10
Equal Kc1 Kc2 Kc3 Kc4 Kc5 Kc6 Kc7 Kc8 Kc9 Kc0 Minus
Tab Q W E R T Y U I O P Backslash
LCtrl A S D F G H J K L LT(1, Semicolon) Quote
LShift Z X C V B LT(1, Escape) Delete MO(2) LGui TG(4) Backspace N M Comma Dot Slash RShift
Grave Home End Left Right Backspace LGui LAlt RGui Enter Space Up Down LeftBracket RightBracket TG(3)
"""

[[keymap.layer]]
name = "Lower"
keys = """
_ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ WM(Equal, LShift) WM(Minus, LShift) WM(Kc9, LShift) WM(Kc0, LShift) _ _ _ _ _ _ _
CapsLock WM(Kc1, LShift) WM(Kc2, LShift) WM(Kc3, LShift) WM(Kc4, LShift) WM(Kc5, LShift) WM(Kc6, LShift) WM(Kc7, LShift) WM(Kc8, LShift) WM(Kc9, LShift) WM(Kc0, LShift) _
_ LeftBracket RightBracket WM(LeftBracket, LShift) WM(RightBracket, LShift) _ _ _ TO(0) _ _ _ _ _ _ _ _ _
_ _ _ MediaPrevTrack MediaNextTrack _ _ _ _ _ MediaPlayPause AudioVolUp AudioVolDown _ _ _
"""

[[keymap.layer]]
name = "Magic"
keys = """
No No No No No No No No No No
No No No No No No No No No No No No
No No No No MaintenanceModeToggle No No No No No No No
Bootloader OutputModeCycle BacklightDown BacklightUp No No No No No No No User12
Reboot No RgbTog RgbModeForward RgbHui No OutputUsb No No No No No No No No No No Reboot
No No No No No User0 User1 User2 No No No No No No No TO(3)
"""

[[keymap.layer]]
name = "Games"
keys = """
_ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ W _ _ _ _ _ _ _ _ _
_ A S D _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ Space _ _ _ _ _ _ _ _ _ _
"""

[[keymap.layer]]
name = "Mac Hyper"
# MOD(...) directly holds the modifier combination until the key is released.
keys = """
_ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ _ _ TG(4) _ _ _ _ _ _ _
_ _ _ _ _ _ _ _ MOD(LCtrl | LAlt | LGui) _ _ _ _ _ _ _
"""

# Each half's Reactive-lighting key-hit processor subscribes in addition to
# RMK's base consumers. Split and BLE feature additions are accounted for
# separately by RMK's subscriber resolver.
[event.keyboard]
channel_size = 16
pubs = 2
subs = 4

# The local lighting processor and the central semantic-replication task both
# subscribe. Split and Rynk feature additions are accounted for separately by
# RMK's subscriber resolver.
[event.layer_change]
channel_size = 4
pubs = 2
subs = 3

# Replication exports a fresh authoritative snapshot after engine mutations.
[event.lighting_changed]
channel_size = 2
pubs = 1
subs = 2

# Changing the maintenance gate invalidates the Magic-layer status LED.
[event.maintenance_mode]
channel_size = 1
pubs = 1
subs = 1

# Indicator state is part of the renderer snapshot, so the central replica
# task needs one slot beyond the existing lighting/Rynk/split consumers.
[event.led_indicator]
channel_size = 3
pubs = 2
subs = 4

# MagicKeyActions consumes the board-reserved User12 action and any lighting
# control actions supplied by an external keyboard configuration.
[event.action]
channel_size = 16
pubs = 1
subs = 1

# Board subscribers: the information-lighting state and the split lighting
# replication task each track both halves' live battery reports. RMK adds
# its own internal subscribers on top of these counts.
[event.battery_status]
channel_size = 2
pubs = 1
subs = 2

[event.peripheral_battery]
channel_size = 3
pubs = 1
subs = 4

[storage]
enabled = true
# ZMK storage partition: 0xec000-0xf4000 (eight 4 KiB sectors, ends at the
# bootloader). The runtime-config partition at 0xdc000 stays reserved.
start_addr = 0xec000
num_sectors = 8

[ble]
enabled = true

[host]
vial_enabled = false
rynk_enabled = true
# Magic+R toggles host maintenance access. Off denies every remote mutation,
# bootloader jump, storage reset, and raw matrix-state read.
maintenance_mode_default = false

[split]
connection = "ble"

# Left half: central (USB + BLE).
[split.central]
rows = 6
cols = 7
row_offset = 0
col_offset = 0
# Static random BLE address for the split link ("GLV80" + 0x01).
ble_addr = [0x01, 0x30, 0x38, 0x56, 0x4c, 0xc7]
# Battery is measured on the internal VDDH/5 channel (ZMK: battery-nrf-vddh).
battery_adc_pin = "vddh"

[split.central.matrix]
matrix_type = "normal"
# From glove80_lh.dts kscan0 (col2row, rows input pull-down).
row_pins = ["P0_26", "P0_05", "P0_06", "P0_08", "P0_07", "P1_09"]
col_pins = ["P1_08", "P1_04", "P1_06", "P1_07", "P1_05", "P1_03", "P1_01"]

# Right half: peripheral, columns 7-13 of the logical grid.
[[split.peripheral]]
rows = 6
cols = 7
row_offset = 0
col_offset = 7
ble_addr = [0x02, 0x30, 0x38, 0x56, 0x4c, 0xc7]
battery_adc_pin = "vddh"

[split.peripheral.matrix]
matrix_type = "normal"
# From glove80_rh.dts kscan0. Column 0 is the right thumb cluster.
row_pins = ["P0_26", "P0_05", "P0_07", "P1_08", "P0_11", "P0_12"]
col_pins = ["P1_06", "P1_04", "P0_02", "P1_07", "P1_05", "P1_03", "P1_01"]

# RMK-native board-wide lighting topology. Stable LED ids preserve the former
# host-overlay numbering: 0-39 are the left chain and 40-79 the right chain.
[lighting]
topology_revision = 1

[[lighting.zone]]
id = 1
name = "per-key"

[[lighting.output]]
node = 0
id = 0
pixel_count = 40
capabilities = ["rgb", "addressable"]

[[lighting.output]]
node = 1
id = 0
pixel_count = 40
capabilities = ["rgb", "addressable"]

[lighting.background]
# Leave keys without an explicit layer, status, or host-overlay contribution
# dark. The master output toggle still gates every lighting source together.
enabled = false
hue = 0
saturation = 0
value = 0
speed = 128
mode = "solid"

